services:
  localstack:
    image: localstack/localstack:3.5.0
    container_name: localstack_main
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,ec2,rds,elbv2,iam,autoscaling
      - DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DEBUG=0
      - LS_LOG=warn
      - PERSISTENCE=1
    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15
    container_name: taobao_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=taobao
      - POSTGRES_PASSWORD=taobao123
      - POSTGRES_DB=taobao
    volumes:
      - "./postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taobao"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow-db-init:
    build: docker/mlflow
    container_name: taobao_mlflow_db_init
    environment:
      - PGHOST=taobao_postgres
      - PGPORT=5432
      - PGUSER=taobao
      - PGPASSWORD=taobao123
      - PGDATABASE=taobao
      - MLFLOW_DB=mlflow
    entrypoint: ["python", "/app/init_mlflow_db.py"]
    volumes:
      - "./init_mlflow_db.py:/app/init_mlflow_db.py"
    depends_on:
      postgres:
        condition: service_healthy

  mlflow:
    build: docker/mlflow
    container_name: taobao_mlflow
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - MLFLOW_S3_ENDPOINT_URL=http://localstack_main:4566
    command: server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql+psycopg2://taobao:taobao123@taobao_postgres:5432/mlflow --default-artifact-root s3://taobao-mlflow-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mlflow-db-init:
        condition: service_completed_successfully